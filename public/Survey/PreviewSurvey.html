<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- <link rel="style" href="./../../src/Components/assets/fonts/fonts.css" /> -->
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet">
  <title>Survey Preview</title>
  <style>
    *{
      box-sizing: border-box;
    }
    body,
    p {
      font-family: "Roboto", sans-serif;
    }

    body {
      margin: 0;
    }
    .informed-survey-text p{
      font-size: 13px;
      color:#70899E;
    }
    .informed-survey {
      width: 100%;
      max-width: 723px;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      background-color: #ffffff;
    }


    .informed-survey-header {
      padding: 16px 30px 22px;
      text-align: center;
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      min-height: 139px;
      gap:16px;
      border-radius: 6px 6px 0 0;
    }

    .informed-survey-header h2 {
      margin: 0;
    }

    .informed-survey-body {
      padding: 24px 56px;
      margin-top: -6px;
      border-radius: 6px;
    }

    .informed-survey-text {
      margin-bottom: 20px;
    }

    .informed-survey-question p {
      margin: 0 0 10px;
    }

    .informed-survey-question label {
      display: block;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .informed-survey-question input[type="radio"],
    .informed-survey-question input[type="checkbox"] {
      margin-right: 10px;
    }

    .form-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
      text-align: center;
    }

    .form-footer button {
      padding: 10px 20px;
      border: none;
      color: #ffffff;
      cursor: pointer;
    }

    .divider {
      border: none;
      border-top: 1px dashed #004a89;
      margin: 20px 0;
    }
    p {
      margin: 0;
    }
    .consent-item {
      margin-bottom: 10px;
    }
    .question-title p {
    color: #004A89;
    font-size: 12px;
    font-weight: 500;
    line-height: 132%;
    margin: 0 4px 17px 0;
}
#survey-form label.check {
    display: block;
    color: #70899E;
    font-size: 12px;
    font-weight: 400;
    line-height: 152%;
    margin: 0 0 12px;
    display: flex;
    width: 100%;
    justify-content: flex-start;
    padding-left: 29px;
    position: relative;
    min-height: 16px;
    word-break: break-word;
}
#survey-form label.check input[type="checkbox"], #survey-form label.check input[type="radio"]{
  position: absolute;
  opacity: 0;
}
#survey-form label.check span.checkmark{
    border: 1px solid #70899E;
    width: 16px;
    border-radius: 50%;
    height: 16px;
    position: absolute;
    left: 0;
    top: 0px;
    cursor: pointer;
}

#survey-form label.check input[type="checkbox"] ~ span.checkmark {
    border-radius: 3px;
    border: 1px solid rgb(112, 137, 158);
    background: #ffffff;
}
#survey-form label.check input[type="checkbox"]:checked ~ .checkmark:after {
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid #ffffff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    border-radius: 0;
    content: "";
    position: absolute;
    display: block;
}
#survey-form label.check input[type="radio"]:checked ~ .checkmark:after {
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #004A89;
    content: "";
    position: absolute;
}
#survey-form label.check input[type="checkbox"]:checked ~ .checkmark {
    background: rgb(0, 74, 137);
}
#survey-form label.check input[type="radio"]:checked ~ .checkmark {
    border-color: #004A89;
}
  </style>
</head>

<body>
  <div id="survey-container" class="informed-survey"></div>

  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      const endPoint = await fetch("./config.json");
      const config = await endPoint.json();
      const queryParams = new URLSearchParams(window.location.search);
      const unique_code = queryParams.get("uniqueCode");
      const survey_id = queryParams.get("surveyId");
      console.log("Fetching data...");

      const apiUrl = config.fetch_preview;
      const payload = {
        unique_code,
        user_id: "0",
        survey_id,
      };

      let data = [];
      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(payload),
        });

        data = await response.json();
        console.log("Fetched Data:", data);
      } catch (error) {
        console.error("Error fetching survey data:", error.message);
        document.getElementById(
          "survey-container"
        ).innerHTML = `<p>Error fetching survey data: ${error.message}</p>`;
        return;
      }

      const customHtml = JSON.parse(data.data[0].survey_info.custom_html)[0];
      let surveyHtml = `
                <div class="informed-survey-header" style="background-color: ${customHtml.header_background_color};">
                    <img src="${customHtml.logo}" alt="Logo" width="${customHtml.logoWidth}%">
                    <h2 style="color: ${customHtml.title_color};font-weight: 700;">${customHtml.main_heading}</h2>
                </div>
                <div class="informed-survey-body" style="background-color: ${customHtml.page_background_color};">
                    <div class="informed-survey-text" style="color: ${customHtml.bodyTextColor};">
                        <p>${customHtml.bodyText}</p>
                    </div>
                    <form id="survey-form">
            `;

      const questions = data.data[0].question_data;
      questions.forEach((question) => {
        switch (question.type) {
          case "multiple":
            surveyHtml += `
                            <div class="d-flex question-title" style="color: ${customHtml.question_answer_color};">${question.question}</div>
                             <p>${question.questionDescription}</p>
                        `;
            question.answer.forEach((answer) => {
              surveyHtml += `
                                <label class="check" style="color: ${customHtml.question_answer_color};">
                                    <input type="radio" name="question${question.questionId}" value="${answer.answerId}">
                                    ${answer.value}
                                    <span class="checkmark"></span>
                                </label>
                            `;
            });
            break;

          case "checkbox":
            surveyHtml += `
                            <div class="d-flex question-title" style="color: ${customHtml.question_answer_color};">${question.question}</div>
                            <p>${question.questionDescription}</p>
                        `;
            question.answer.forEach((answer) => {
              surveyHtml += `
                                <label class="check" style="color: ${customHtml.question_answer_color};">
                                    <input type="checkbox" name="question${question.questionId}" value="${answer.answerId}">
                                    ${answer.value}
                                    <span class="checkmark"></span>
                                </label>
                            `;
            });
            break;

          case "dropdown":
            surveyHtml += `
                            <div class="d-flex question-title" style="color: ${customHtml.question_answer_color};">${question.question}</div>
                            <p>${question.questionDescription}</p>
                            <select name="question${question.questionId}">
                        `;
            question.answer[0].value.forEach((option) => {
              const combinedValue = `${question.answer[0].answerId},${option}`;
              surveyHtml += `
                                <option value="${combinedValue}">${option}</option>
                            `;
            });
            surveyHtml += `</select>`;
            break;

          case "rating":
            surveyHtml += `
                    <div class="d-flex question-title" style="color: ${customHtml.question_answer_color};">${question.question}</div>
                    <p>${question.questionDescription}</p>
                `;
            if (question.extra.ratingType === "stars") {
              surveyHtml += `
                        <div class="rating-stars" style="color: ${question.extra.ratingColor};">
                    `;
              for (let i = 1; i <= question.extra.ratingScale; i++) {
                surveyHtml += `
                            <label>
                                <input type="radio" name="rating${question.questionId}" value="${i}" />
                                &#9733;
                            </label>
                        `;
              }
              surveyHtml += `</div>`;
            } else {
              surveyHtml += `<input type="number" name="rating${question.questionId}" min="1" max="${question.extra.ratingScale}" />`;
            }
            break;

          case "matrix":
            const inputType = question.extra.allowMultipleAnswer
              ? "checkbox"
              : "radio"; // Assume this specifies 'checkbox' or 'radio'
            surveyHtml += `<div class="d-flex question-title" style="color: ${customHtml.question_answer_color};">${question.question}</div>
        <p>${question.questionDescription}</p>
        <table>
            <thead>
                <tr>
                    ${question.answer
                .map((a) => `<th>${a.value}</th>`)
                .join("")}
                </tr>
            </thead>
            <tbody>
                ${question.extra.rows
                .map(
                  (row) => `
                    <tr>
                        <td>${row.value}</td>
                        ${question.answer
                      .map(
                        (option) => `
                            <td>
                              
                                 <input type=${inputType} name=question${question.questionId} value=${option.answerId}>
                                    
                            </td>
                        `
                      )
                      .join("")}
                    </tr>
                `
                )
                .join("")}
            </tbody>
    ${question.extra.rows
      .map(
        (row) => `
        <tr>
            <td>${row.value}</td>
            ${question.answer
              .map((option) => {
                const combinedValue = `${option.answerId},${row.value}`;
                return `
                    <td>
                      <input type="${inputType}" name="question${question.questionId}" value="${combinedValue}">   
                    </td>
                  `;
              })
              .join("")}
        </tr>
      `
      )
      .join("")}
</tbody>

        </table>
    `;
            break;

          case "freeText":
            surveyHtml += `
                            <div class="d-flex question-title" style="color: ${customHtml.question_answer_color};">${question.question}</div>
                            <textarea name="question${question.questionId}" placeholder="${question.extra}"></textarea>
                        `;
            break;

          case "heading":
            surveyHtml += `
                            <h3 style="color: ${customHtml.question_answer_color};">${question.question}</h3>
                            <p>${question.questionDescription}</p>
                        `;
            break;

          case "paragraph":
            surveyHtml += `
                            <div class="d-flex question-title" style="color: ${question.style.color};">${question.question}</div>
                        `;
            break;

          case "divideLine":
            surveyHtml += `
                            <div class="divider" style=" width:${question.style.width}%;  borderTop: ${question.style.height}px ${question.style.lineStyle} ${question.style.color};">
                            &nbsp
                            </div>
                        `;
            break;

          case "image":
            surveyHtml += `
                            <img src="${question.question}" alt="Survey Image" style="width: ${question.style.width}px; height: ${question.style.height};">
                        `;
            break;

          case "consent":
            surveyHtml += `
                            <div class="d-flex question-title">${question.question}</div>
                            ${question.extra.consentOptions
                .map(
                  (option) => `
                                <div class="consent-item">
                                    <input type="checkbox" name="consentOption" value="${option.label
                    }" ${option.isChecked ? "checked" : ""}>
                                    ${option.label}
                                </div>
                            `
                )
                .join("")}
                            <p>${question.extra.cookiePolicy}</p>
                            <div class="copyright-links">
                                ${question.extra.privacyLinks
                .map(
                  (link) => `
                                    <a href="${link.octapharma ||
                    link.docintel ||
                    link.termsOfUse
                    }" target="_blank">${Object.keys(link)[0]
                    } Privacy Policy</a>
                                `
                )
                .join(" ")}
                            </div>
                            <p>${question.extra.operatingStatement}</p>
                        `;
            break;

          default:
            console.log(`Unknown question type: ${question.type}`);
        }
      });

      surveyHtml += `
                <div class="form-footer">
                    <button type="button" id="submit-button" style="background: ${customHtml.button_color};">${customHtml.button_text}</button>
                    <span style="color: ${customHtml.bodyTextColor};">${customHtml.main_footer}</span>
                </div>
            </form></div>`;

      document.getElementById("survey-container").innerHTML = surveyHtml;

      document
        .getElementById("submit-button")
        .addEventListener("click", async () => {
          const formData = new FormData(
            document.getElementById("survey-form")
          );
          console.log(formData);
          const obj = {};
          // formData.forEach((value, key) => {
          //     console.log(value, key)
          //   obj[key] = value;
          // });

          formData.forEach((value, key) => {
            // Check if the key already exists in the object
            if (obj.hasOwnProperty(key)) {
              // If the key already exists, convert its value to an array if it's not already one
              if (!Array.isArray(obj[key])) {
                obj[key] = [obj[key]];
              }
              // Push the new value into the array
              obj[key].push(value);
            } else {
              // If the key does not exist, just assign the value
              obj[key] = value;
            }
          });
          console.log(obj);
          const responses = [];

          questions.forEach((question) => {
            const response = {
              question_id: question.questionId,
              answer_id: [],
              comment: "",
            };

            if (
              question.type === "multiple"
            ) {
              formData.forEach((value, key) => {
                if (key.startsWith(`question${question.questionId}`)) {
                  response.answer_id.push(value);
                }
              });
            } else if (question.type === "checkbox") {
              formData.forEach((value, key) => {
                if (key.startsWith(`question${question.questionId}`)) {
                  response.answer_id.push(value);
                }

            }
            else if (question.type === "dropdown") {
              const value = formData.get(`question${question.questionId}`);
              const valueArray = value.split(",");
              if (valueArray.length > 0) {
                response.answer_id.push(valueArray[0]);
                response.comment = valueArray[1];
              }
            } else if (question.type === "rating") {
              const value = formData.get(`rating${question.questionId}`);
              console.log(value);
              if (value) {
                response.comment = value;
              }
            } else if (question.type === "matrix") {

            }
              if (question.type === "multiple") {
                formData.forEach((value, key) => {
                  if (key.startsWith(`question${question.questionId}`)) {

                  }

              } else if (question.type === "checkbox") {

                  }
                });
              } else if (question.type === "dropdown") {
                const value = formData.get(`question${question.questionId}`);
                const valueArray = value.split(",");
                if (valueArray.length > 0) {
                  response.answer_id.push(valueArray[0]);
                  response.comment = valueArray[1];
                }
              } else if (question.type === "rating") {
                const value = formData.get(`rating${question.questionId}`);
                console.log(value);
                if (value) {
                  response.comment = value;
                }
              } else if (question.type === "matrix") {
              }

            // For text areas or comments, if any
            if (question.type === "freeText") {
              response.comment =
                formData.get(`question${question.questionId}`) || "";
            }

            responses.push(response);
          });

          const submitPayload = { survey_responses: responses };

          console.log(submitPayload);
          console.log("jderfrf");

          // try {

          //     const submitApiUrl = config.insert_responses;
          //     const submitResponse = await fetch(submitApiUrl, {
          //         method: "POST",
          //         headers: {
          //             "Content-Type": "application/json",
          //         },
          //         body: JSON.stringify(submitPayload),
          //     });

          //     if (submitResponse.ok) {
          //         alert("Survey submitted successfully!");
          //     } else {
          //         alert("Failed to submit the survey. Please try again.");
          //     }
          // } catch (error) {
          //     console.error("Error submitting survey:", error.message);
          //     alert("An error occurred while submitting the survey. Please try again.");

        });
    });
  </script>
</body>

</html>
